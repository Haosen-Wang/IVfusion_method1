data:
  d_data_dir: "/data/1024whs_data/DeMMI-RF/Train/degrad/noise50/FMB"
  v_data_dir: "/data/1024whs_data/DeMMI-RF/Train/visible/noise50/FMB"
  i_data_dir: "/data/1024whs_data/DeMMI-RF/Train/infrared/noise50/FMB"
  checkpoint_d: "/data/1024whs_checkpoint/Degradclean/Train_Degradclean_FMB_visible/latest_checkpoint.pth"
  checkpoint_iv: "/data/1024whs_checkpoint/iv_fusion/Train_IVfusion_FMB/latest_checkpoint.pth"
  mode: "RGB"

training:
  project_name: "Train_DIV_FMB_visible"
  task: "dv_i"
  batch_size: 2  # 小批次避免内存问题
  num_epochs: 5  # 快速测试
  resume_from_checkpoint: true

device:
  device_1: "cuda:0"
  device_2: "cuda:1"
  device_3: "cuda:2"
model:
  i_block_num: 2
  v_block_num: 2
  i_expert_num: 4
  v_expert_num: 4
  i_topk_expert: 2
  v_topk_expert: 2
  i_alpha: 1.0
  v_alpha: 1.0
  f_block_num: 2

memory:
  checkpoint_memory_efficient: true  # 启用内存高效的检查点加载
  load_optimizer_state: false  # 是否加载优化器状态（设为false可节省显存）
  compress_checkpoints: true  # 压缩保存检查点文件
  save_optimizer_in_epoch_checkpoints: false  # epoch检查点是否保存优化器状态